}
function confirmReset() {
  confirmBox('Cancellare tutti i dati?', 'Alunni, aula, ipotesi e storico verranno eliminati. Se vuoi conservarli, esporta prima un backup.', 'Cancella tutto', () => {
    S = emptyState(); UI.activeHyp = null; UI.undo = []; UI.sel = null; UI.openEntries = null; UI.tab = 'posti'; commit(); toast('Dati cancellati.');
  }, 'danger');
}

/* ---------- stampa ---------- */
function fillPrint(L, assign, sub, nameFn) {
  $('#print-root').innerHTML = `<div class="sheet"><div class="sheet-head"><h1>${esc(S.className || 'Classe')}</h1><p>${esc(sub)}${S.settings.flip ? ', vista dalla cattedra' : ''}</p></div>${roomHTML(L, assign, { mode: 'print', flip: S.settings.flip, nameFn })}</div>`;
}
function printHyp() {
  const h = activeHyp(); if (!h) return;
  fillPrint(S.layout, h.assign, 'Ipotesi ' + h.name + ', ' + fmtLong(todayISO()));
  doPrint();
}
function printEntry(e) {
  fillPrint(e.layout, e.assign, 'Posti dal ' + fmtLong(e.date) + (e.label ? ' (' + e.label + ')' : ''), id => (stu(id) ? stu(id).name : (e.names[id] || '')));
  doPrint();
}
function doPrint() { setTimeout(() => { try { window.print(); } catch (err) { toast('Stampa non disponibile qui: scarica il file e aprilo nel browser.'); } }, 60); }

/* ---------- smistamento degli eventi ---------- */
function handleAct(act, el) {
  const d = el.dataset;
  switch (act) {
    case 'goto': go(d.v); break;
    case 'ptype': UI.preset.type = d.v; renderAula(); break;
    case 'pstep': UI.preset[d.k] += +d.d; fixPreset(UI.preset); render(); break;
    case 'pset': UI.preset[d.k] = +d.v; fixPreset(UI.preset); render(); break;
    case 'apply-preset': applyPreset(); break;
    case 'tool': UI.tool = d.v; render(); break;
    case 'gstep': gridStep(d.k, +d.d); break;
    case 'auto-front': autoFront(S.layout); afterLayout(); commit(); toast('Prima fila: la fila di banchi più vicina alla cattedra.'); break;
    case 'add-student': addFromInput(); break;
    case 'toggle-paste': UI.showPaste = !UI.showPaste; render(); if (UI.showPaste && $('#pasteArea')) $('#pasteArea').focus(); break;
    case 'paste-add': addFromPaste(); break;
    case 'sort-az': S.students.sort(byName); commit(); break;
    case 'del-student': { const s = stu(d.sid); if (s) confirmBox('Eliminare ' + s.name + '?', 'Sparirà dall\'elenco e dalle ipotesi in corso. Nelle disposizioni già salvate resta il suo nome.', 'Elimina', () => { deleteStudent(s.id); commit(); }, 'danger'); break; }
    case 'front': { const s = stu(d.sid); if (s) { s.prefs.front = d.v; commit(); } break; }
    case 'unavoid': removeAvoid(d.sid, d.o); commit(); break;
    case 'gen': startGenerate(); break;
    case 'hyp': UI.activeHyp = d.id; UI.sel = null; render(); break;
    case 'del-hyp': deleteHyp(d.id); break;
    case 'new-empty': newHyp({}, 'disposta a mano'); break;
    case 'new-last': { const last = sortedHistory().slice(-1)[0]; if (last) newHyp(assignFromEntry(last), 'copia della disposizione del ' + fmtShort(last.date)); break; }
    case 'undo': undo(); break;
    case 'flip': S.settings.flip = !S.settings.flip; commit(); break;
    case 'print-hyp': printHyp(); break;
    case 'save-hyp': openSaveDialog(); break;
    case 'entry-base': { const e = S.history.find(x => x.id === d.id); if (e) { newHyp(assignFromEntry(e), 'copia della disposizione del ' + fmtShort(e.date)); window.scrollTo({ top: 0 }); } break; }
    case 'entry-print': { const e = S.history.find(x => x.id === d.id); if (e) printEntry(e); break; }
    case 'entry-edit': { const e = S.history.find(x => x.id === d.id); if (e) openEntryEdit(e); break; }
    case 'entry-del': { const e = S.history.find(x => x.id === d.id); if (e) confirmBox('Eliminare la disposizione del ' + fmtLong(e.date) + '?', 'Non verrà più considerata nelle segnalazioni.', 'Elimina', () => { S.history = S.history.filter(x => x !== e); commit(); }, 'danger'); break; }
    case 'export': closeMenu(); exportData(); break;
    case 'import': closeMenu(); openImportDialog(); break;
    case 'show-text': closeMenu(); showDataText(); break;
    case 'demo': closeMenu(); if (S.students.length || S.history.length) confirmBox('Caricare la classe di esempio?', 'I dati attuali verranno sostituiti. Se vuoi conservarli, esporta prima un backup.', 'Carica l\'esempio', loadDemo); else loadDemo(); break;
    case 'reset': closeMenu(); confirmReset(); break;
    case 'banner-off': UI.bannerOff = true; renderBanner(); break;
  }
}
function setHL(str) {
  if (UI.hl === str) return;
  UI.hl = str;
  $$('.seat.hl').forEach(s => s.classList.remove('hl'));
  if (str) str.split(' ').forEach(k => { const el = document.querySelector('#view-posti .seat[data-k="' + k + '"]'); if (el) el.classList.add('hl'); });
}
function isTyping(t) { return t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable); }

function bindEvents() {
  document.addEventListener('click', e => {
    const t = e.target;
    const menu = $('#dataMenu');
    if (menu && menu.open && !menu.contains(t)) menu.open = false;
    const tab = t.closest('[data-tab]'); if (tab) { go(tab.dataset.tab); return; }
    const act = t.closest('[data-act]'); if (act && !act.disabled) { handleAct(act.dataset.act, act); return; }
    if (UI.suppressClick) return;
    const chip = t.closest('#view-posti .chip'); if (chip) { onChipClick(chip.dataset.sid); return; }
    const empty = t.closest('#view-posti [data-empty]');
    if (empty) { if (UI.sel) moveStudent(UI.sel.sid, { type: 'seat', key: empty.dataset.empty }); else toast('Tocca prima un nome, poi il banco libero.'); return; }
    const issue = t.closest('.issue');
    if (issue) { setHL(''); setHL(issue.dataset.seats); const k = issue.dataset.seats.split(' ')[0]; const s = k && document.querySelector('#view-posti .seat[data-k="' + k + '"]'); if (s) s.scrollIntoView({ block: 'nearest', inline: 'nearest' }); return; }
    const tray = t.closest('[data-drop="tray"]');
    if (tray && UI.sel) { const h = activeHyp(); if (h && seatOf(h, UI.sel.sid)) moveStudent(UI.sel.sid, { type: 'tray' }); return; }
    const cell = t.closest('#egrid [data-cell]'); if (cell && e.detail === 0) { toggleCellByKeyboard(cell.dataset.cell); return; }
  });
  document.addEventListener('pointerdown', e => {
    if (e.target.closest('#view-posti .chip')) onChipDown(e);
    else if (e.target.closest('#egrid [data-cell]')) onEditorDown(e);
  });
  document.addEventListener('touchmove', e => { if (drag && drag.started) e.preventDefault(); }, { passive: false });
  document.addEventListener('contextmenu', e => { if (e.target.closest && e.target.closest('#view-posti .chip')) e.preventDefault(); });
  window.addEventListener('resize', debounce(updateMapHint, 150));
  document.addEventListener('change', e => {
    const t = e.target, f = t.dataset.field;
    if (t.name === 'adj') { S.layout.adj = t.value === 'hv' ? 'hv' : 'h'; commit(); return; }
    if (t.id === 'importFile') {
      const file = t.files && t.files[0]; if (!file) return;
      const rd = new FileReader();
      rd.onload = () => { const ta = $('#dlgText'); if (ta) { ta.value = String(rd.result); const fn = $('#dlgFile'); if (fn) fn.textContent = file.name; } else importText(String(rd.result)); };
      rd.onerror = () => toast('Non riesco a leggere il file.');
      rd.readAsText(file); return;
    }
    if (t.classList.contains('name') && t.dataset.sid) {
      const s = stu(t.dataset.sid); if (!s) return;
      const v = t.value.replace(/\s+/g, ' ').trim() || 'Senza nome';
      s.name = v; t.value = v; touch(); return;
    }
    if (t.id === 'className') { S.className = t.value.trim(); touch(); renderHeader(); return; }
    if (!f) return;
    if (f === 'depth') { S.settings.depth = clamp(parseInt(t.value, 10) || 0, 0, 50); commit(); return; }
    const s = stu(t.dataset.sid); if (!s) return;
    if (f === 'seat') s.prefs.seat = t.value || null;
    else if (f === 'mate') setMate(s, t.value || null);
    else if (f === 'avoid' && t.value) addAvoid(s.id, t.value);
    commit();
  });
  document.addEventListener('input', e => {
    const t = e.target;
    if (t.classList.contains('name') && t.dataset.sid) {
      const s = stu(t.dataset.sid); if (!s) return;
      s.name = t.value.slice(0, 60);
      $$('#view-alunni option[value="' + cssq(s.id) + '"]').forEach(o => { o.textContent = s.name; });
      $$('#view-alunni .tag[data-o="' + cssq(s.id) + '"] .tname').forEach(o => { o.textContent = s.name; });
      touch();
    } else if (t.id === 'className') { S.className = t.value; touch(); }
    else if (t.id === 'period') {
      const v = parseInt(t.value, 10); if (!v) return;
      S.settings.periodWeeks = clamp(v, 1, 20); touch();
      const rt = $('#rhythmText'); if (rt) rt.innerHTML = rhythmText();
      const pu = $('#periodUnit'); if (pu) pu.textContent = S.settings.periodWeeks === 1 ? 'settimana' : 'settimane';
    }
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      if (UI.modal) { closeModal(); return; }
      if (drag) { cleanupDrag(); return; }
      if (UI.sel) { const sid = UI.sel.sid; UI.sel = null; renderPosti(); focusChip(sid); return; }
      closeMenu();
    }
    if (e.key === 'Enter' && e.target.id === 'newName') { e.preventDefault(); addFromInput(); }
    if ((e.ctrlKey || e.metaKey) && !e.shiftKey && e.key.toLowerCase() === 'z' && UI.tab === 'posti' && !UI.modal && !isTyping(e.target)) { e.preventDefault(); undo(); }
    if ((e.key === 'ArrowRight' || e.key === 'ArrowLeft') && e.target.matches('.tabs [data-tab]')) {
      const tabs = $$('.tabs [data-tab]'), i = tabs.indexOf(e.target), n = tabs[(i + (e.key === 'ArrowRight' ? 1 : tabs.length - 1)) % tabs.length];
      go(n.dataset.tab); n.focus();
    }
  });
  const hlOver = e => { const it = e.target.closest && e.target.closest('.issue'); if (it) setHL(it.dataset.seats); };
  const hlOut = e => { const it = e.target.closest && e.target.closest('.issue'); if (it && !(e.relatedTarget && it.contains(e.relatedTarget))) setHL(''); };
  $('#view-posti').addEventListener('mouseover', hlOver);
  $('#view-posti').addEventListener('mouseout', hlOut);
  $('#view-posti').addEventListener('focusin', hlOver);
  $('#view-posti').addEventListener('focusout', hlOut);
  $('#view-storico').addEventListener('toggle', e => {
    const d = e.target; if (!d.matches || !d.matches('details.entry')) return;
    if (!UI.openEntries) UI.openEntries = new Set($$('#view-storico details.entry[open]').map(x => x.dataset.eid));
    if (d.open) UI.openEntries.add(d.dataset.eid); else UI.openEntries.delete(d.dataset.eid);
  }, true);
  window.addEventListener('beforeprint', () => {
    if ($('#print-root').innerHTML) return;
    const h = activeHyp(), last = sortedHistory().slice(-1)[0];
    if (h) fillPrint(S.layout, h.assign, 'Ipotesi ' + h.name + ', ' + fmtLong(todayISO()));
    else if (last) fillPrint(last.layout, last.assign, 'Posti dal ' + fmtLong(last.date), id => (stu(id) ? stu(id).name : (last.names[id] || '')));
  });
  window.addEventListener('afterprint', () => { $('#print-root').innerHTML = ''; });
  const flush = () => { if (UI.storage === 'local' && Store.pending()) Store.save(); };
  window.addEventListener('pagehide', flush);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flush(); });
  window.addEventListener('beforeunload', e => {
    flush();
    if ((UI.storage === 'file' && UI.dirty) || (UI.storage === 'local' && UI.saveError)) { e.preventDefault(); e.returnValue = ''; }
  });
  window.addEventListener('storage', e => {
    if (UI.storage !== 'local' || e.key !== APP_KEY || !e.newValue || drag || paint || UI.modal) return;
    try {
      S = normalize(JSON.parse(e.newValue));
      if (!S.hyps.some(h => h.id === UI.activeHyp)) UI.activeHyp = S.hyps[0] ? S.hyps[0].id : null;
      UI.undo = []; UI.sel = null; render();
      toast('Dati aggiornati da un\'altra scheda aperta con questa app.');
    } catch (err) { /* ignora dati illeggibili */ }
  });
}

/* ---------- avvio ---------- */
async function init() {
  bindEvents();
  renderStatus();
  let raw = null;
  try { raw = await Store.load(); } catch (e) { raw = null; }
  S = normalize(raw);
  UI.activeHyp = S.hyps[0] ? S.hyps[0].id : null;
  UI.tab = 'posti';
  UI.loaded = true;
  render();
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
</script>
</body>
</html>
